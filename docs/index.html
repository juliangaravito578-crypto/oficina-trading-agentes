<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Oficina Virtual de Agentes de Trading</title>
    <style>
        body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85); padding: 20px; border-radius: 12px; border: 1px solid #334155; max-width: 350px; }
        h1 { font-size: 1.2rem; margin-top: 0; color: #38bdf8; }
        .agent-card { background: #1e293b; padding: 10px; margin-top: 10px; border-radius: 8px; border-left: 4px solid #38bdf8; cursor: pointer; }
        .agent-card:hover { background: #334155; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>🏢 Oficina de Agentes 24/7</h1>
        <p>Haz clic en cada escritorio o panel para ver su actividad en tiempo real.</p>
        <div id="status-box">Cargando estado de la oficina...</div>
    </div>
    <div id="canvas-container"></div>

    <!-- Three.js para la vista 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuración básica de la escena 3D de la oficina
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Luz ambiental y direccional
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Piso de la oficina
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Crear 4 escritorios para los 4 agentes
        const desks = [];
        const colors = [0x38bdf8, 0x34d399, 0xf472b6, 0xfbbf24];
        for(let i = 0; i < 4; i++) {
            const deskGeo = new THREE.BoxGeometry(2, 0.8, 1.5);
            const deskMat = new THREE.MeshStandardMaterial({ color: colors[i] });
            const desk = new THREE.Mesh(deskGeo, deskMat);
            
            // Posicionar en forma de herradura
            const angle = (i / 4) * Math.PI * 2;
            desk.position.x = Math.cos(angle) * 5;
            desk.position.z = Math.sin(angle) * 5;
            desk.position.y = 0.4;
            scene.add(desk);
            desks.push(desk);
        }

        // Animación de rotación suave de cámara
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Cargar datos reales generados por los agentes
        fetch('estado_oficina.json')
            .then(res => res.json())
            .then(data => {
                let html = "";
                for (let key in data) {
                    html += `<div class="agent-card"><strong>${key.toUpperCase()}</strong><br><small>${data[key].detalle}</small></div>`;
                }
                document.getElementById('status-box').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('status-box').innerHTML = "<p>Esperando primera ejecución en la nube...</p>";
            });
    </script>
</body>
</html>
